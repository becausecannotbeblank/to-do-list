<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <div id="fade">
        <header>
            <nav>
              <!--  <button><span class="material-symbols-outlined">menu</span></button>-->
                <div id="logo">ToDo</div>

                <div id="console">
                    <button class="console-button"><span id="console-icon" class="material-symbols-outlined">add_box</span></button>
<!--alter this to closed eye later--><button class="console-button"><span class="material-symbols-outlined">visibility</span></button>
                    <button class="console-button"><span class="material-symbols-outlined">star</span></button>
                    <button class="console-button"><span class="material-symbols-outlined">timer</span></button>
                </div>

                <button id="switch-theme-button"><span id="darkmode" class="material-symbols-outlined">dark_mode</span></button>
            </nav>
        </header>

        
        <div id="content"> <!--render everything in here-->
            <div class="list-container">
                <div class="list-taskbar">
                    <div class="title"><p>Stuff I need to do today and more characters and stuff.</p></div>

                    <div class="list-taskbar-options">
                        <button><span class="material-symbols-outlined">visibility</span></button>

                        <button><span class="material-symbols-outlined">close</span></button>
                    </div>
                </div>

                <div class="list-content">
                    <button class="add-entry">
                        <div class="entry-symbol">
                            <span id="console-icon" class="material-symbols-outlined">add_box</span>
                        </div>

                        <div><p>Add a new task</p></div>
                    </button>

                    <button class="entry">
                        <div class="entry-drag-flex">
                            <div class="entry-symbol">
                                <span id="console-icon" class="material-symbols-outlined">drag_indicator</span>
                            </div>

                            <div class="entry-text"><p>Walk the dog and feed the cat</p></div>
                        </div>

                        <div class="entry-options-flex">
                            <div class="entry-checkbox"><span class="material-symbols-outlined"><span class="material-symbols-outlined">check_box</span></span></div>
                        
                            <div class="entry-options"><span class="material-symbols-outlined">more_vert</span></div>
                        </div>
                    </button>

                    <button class="entry">
                        <div class="entry-drag-flex">
                            <div class="entry-symbol">
                                <span id="console-icon" class="material-symbols-outlined">drag_indicator</span>
                            </div>

                            <div class="entry-text"><p>Groceries</p></div>
                        </div>

                        <div class="entry-options-flex">
                            <div class="entry-checkbox"><span class="material-symbols-outlined"><span class="material-symbols-outlined">check_box_outline_blank</span></span></div>
                        
                            <div class="entry-options"><span class="material-symbols-outlined">more_vert</span></div>
                        </div>
                    </button>
                </div>

            </div>
        </div>

        <footer></footer>
    </div>
</body>
</html>
