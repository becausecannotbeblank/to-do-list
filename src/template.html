<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <div id="fade">
        <header>
            <nav>
              <!--  <button><span class="material-symbols-outlined">menu</span></button>-->
                <div id="logo">ToDo</div>

                <div id="container">
                    <button class="container-button"><span id="console-icon" class="material-symbols-outlined">add_box</span></button>
<!--alter this to closed eye later--><button class="container-button"><span class="material-symbols-outlined">visibility</span></button>
                    <button class="container-button"><span class="material-symbols-outlined">star</span></button>
                    <button class="container-button"><span class="material-symbols-outlined">timer</span></button>
                </div>

                <button id="switch-theme-button"><span id="darkmode" class="material-symbols-outlined">dark_mode</span></button>
            </nav>
        </header>

        <!--render from here-->
        <div id="content"> 
            <div class="list-container">
                <div class="title"><h3>Title</h3></div>

                <div class="entry">
                    <div class="checkbox-name">
                        <span id="console-icon" class="material-symbols-outlined">add_box</span>
                        <div>Add a new task</div>
                    </div>
                </div>

                <div class="entry">
                    <div class="checkbox-name">
                        <div class="drag-indicator"><span class="material-symbols-outlined">drag_indicator</span></div>
                        <input type="checkbox" name="" id="" checked=true>
                        <div>Name</div>
                    </div>

                    <div class="dropdown"><span class="material-symbols-outlined">more_vert</span>
                        <div class="dropdown-content">
                            <div class="dropdown-icons">
                                <button class="dropdown-button"><span class="material-symbols-outlined">edit</span>edit</button>
                                <button class="dropdown-button"><span class="material-symbols-outlined">autorenew</span>repeat</button>
                                <button class="dropdown-button"><span class="material-symbols-outlined">delete</span>delete</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <footer></footer>
    </div>
</body>
</html>
